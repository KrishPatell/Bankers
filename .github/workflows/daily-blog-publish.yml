name: Daily blog publishing

on:
  schedule:
    # GitHub Actions cron is UTC. 00:30 UTC is 06:00 Asia/Kolkata.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read and validate today's schedule without changing the repository"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bankers-daily-blog-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install automation dependencies
        run: python -m pip install --disable-pip-version-check --no-warn-script-location python-docx google-api-python-client google-auth

      - name: Read today's sheet row and prepare the blog
        id: prepare
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_SCHEDULE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_SCHEDULE_FOLDER_ID }}
          GOOGLE_DRIVE_THUMBNAIL_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_THUMBNAIL_FOLDER_ID }}
        run: |
          args=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          python tools/daily_blog.py --report automation-report.json "${args[@]}"

      - name: Upload source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-blog-report-${{ github.run_id }}
          path: automation-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Stop after dry run
        if: ${{ inputs.dry_run == true }}
        run: echo "Dry run completed; no repository or production changes were made."

      - name: Build site
        if: ${{ inputs.dry_run != true && steps.prepare.outputs.actionable == 'true' }}
        run: python tools/build.py

      - name: Verify site
        if: ${{ inputs.dry_run != true && steps.prepare.outputs.actionable == 'true' }}
        run: python tools/verify.py

      - name: Commit and push validated source
        if: ${{ inputs.dry_run != true && (steps.prepare.outputs.actionable == 'true' || steps.prepare.outputs.needs_retrigger == 'true') }}
        run: |
          git config user.name "bankers-daily-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cms src/images/blog
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore: retrigger production deployment"
          else
            git commit -m "Publish scheduled Bankers Vascular blog"
          fi
          git push origin HEAD:main

      - name: Verify production URL, listing, and sitemap
        if: ${{ inputs.dry_run != true && (steps.prepare.outputs.actionable == 'true' || steps.prepare.outputs.needs_retrigger == 'true') }}
        run: python tools/check_live.py --report automation-report.json --output live-report.json

      - name: Upload production verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-blog-live-report-${{ github.run_id }}
          path: live-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Failure notification summary
        if: failure()
        run: |
          {
            echo "## Daily blog publishing failed"
            echo
            echo "The scheduled blog was not marked as published because validation or the live-site check failed."
            echo "Download the \\`daily-blog-report-${{ github.run_id }}\\` and \\`daily-blog-live-report-${{ github.run_id }}\\` artifacts for the exact reason."
            echo "GitHub Actions failure notifications must be enabled for the repository owner/watchers."
          } >> "$GITHUB_STEP_SUMMARY"
