name: Sync Google Reviews

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankers-google-reviews-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_BUSINESS_PROFILE_CLIENT_ID: ${{ secrets.GOOGLE_BUSINESS_PROFILE_CLIENT_ID }}
      GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET: ${{ secrets.GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET }}
      GOOGLE_BUSINESS_PROFILE_REFRESH_TOKEN: ${{ secrets.GOOGLE_BUSINESS_PROFILE_REFRESH_TOKEN }}
      GOOGLE_BUSINESS_PROFILE_ACCESS_TOKEN: ${{ secrets.GOOGLE_BUSINESS_PROFILE_ACCESS_TOKEN }}
      GOOGLE_BUSINESS_PROFILE_AHMEDABAD_CLIENT_ID: ${{ secrets.GOOGLE_BUSINESS_PROFILE_AHMEDABAD_CLIENT_ID }}
      GOOGLE_BUSINESS_PROFILE_AHMEDABAD_CLIENT_SECRET: ${{ secrets.GOOGLE_BUSINESS_PROFILE_AHMEDABAD_CLIENT_SECRET }}
      GOOGLE_BUSINESS_PROFILE_AHMEDABAD_REFRESH_TOKEN: ${{ secrets.GOOGLE_BUSINESS_PROFILE_AHMEDABAD_REFRESH_TOKEN }}
      GOOGLE_BUSINESS_PROFILE_AHMEDABAD_ACCESS_TOKEN: ${{ secrets.GOOGLE_BUSINESS_PROFILE_AHMEDABAD_ACCESS_TOKEN }}
      GOOGLE_BUSINESS_PROFILE_VADODARA_CLIENT_ID: ${{ secrets.GOOGLE_BUSINESS_PROFILE_VADODARA_CLIENT_ID }}
      GOOGLE_BUSINESS_PROFILE_VADODARA_CLIENT_SECRET: ${{ secrets.GOOGLE_BUSINESS_PROFILE_VADODARA_CLIENT_SECRET }}
      GOOGLE_BUSINESS_PROFILE_VADODARA_REFRESH_TOKEN: ${{ secrets.GOOGLE_BUSINESS_PROFILE_VADODARA_REFRESH_TOKEN }}
      GOOGLE_BUSINESS_PROFILE_VADODARA_ACCESS_TOKEN: ${{ secrets.GOOGLE_BUSINESS_PROFILE_VADODARA_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Sync and publish Google Reviews feed
        run: node scripts/sync-google-reviews.mjs
