<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videos | Bankers Vascular Centre</title>
  <meta name="description" content="Latest and popular educational videos from Bankers Vascular Centre.">
  <link rel="stylesheet" href="css/youtube-feed.css">
</head>
<body class="youtube-page">
  <main class="youtube-shell">
    <a class="youtube-brand" href="/">Bankers Vascular Centre</a>
    <header class="youtube-hero">
      <p class="youtube-eyebrow">Bankers Vascular Centre</p>
      <h1>Latest health videos</h1>
      <p>New videos from our YouTube channel appear here automatically.</p>
    </header>
    <section aria-labelledby="popular-heading">
      <div class="youtube-section-heading"><h2 id="popular-heading">Popular on YouTube</h2><a href="https://www.youtube.com/@bankersvascular" target="_blank" rel="noopener">Visit channel</a></div>
      <div id="youtube-popular" class="youtube-grid" data-state="loading"><p class="youtube-status">Loading videos…</p></div>
    </section>
    <section aria-labelledby="latest-heading">
      <div class="youtube-section-heading"><h2 id="latest-heading">Latest videos</h2></div>
      <div id="youtube-latest" class="youtube-grid" data-state="loading"><p class="youtube-status">Loading videos…</p></div>
    </section>
  </main>
  <script src="js/youtube-feed.js" defer></script>
</body>
</html>
